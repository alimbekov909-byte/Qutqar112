<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Shield/Rounded Box -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Outer subtle ring -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#fca5a5" stroke-opacity="0.25" stroke-width="4"/>
  
  <!-- Shield Icon Outline -->
  <path d="M 256,80 L 396,132 C 396,260 336,368 256,420 C 176,368 116,260 116,132 Z" 
        fill="#ffffff" 
        fill-opacity="0.12" 
        stroke="#ffffff" 
        stroke-width="12" 
        stroke-linejoin="round"
        filter="url(#shadow)"/>
  
  <!-- Medical / Emergency Cross Center -->
  <path d="M 226,170 H 286 V 226 H 342 V 286 H 286 V 342 H 226 V 286 H 170 V 226 H 226 Z" 
        fill="#ffffff" 
        rx="10"/>

  <!-- Star / 112 text on bottom -->
  <text x="256" y="396" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="34" 
        font-weight="900" 
        fill="#ffffff" 
        letter-spacing="4" 
        text-anchor="middle">
    112 SOS
  </text>
</svg>
